version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    assignees:
      - sbs44
    commit-message:
      prefix: chore
      include: scope
    schedule:
      interval: daily
      time: "01:00"
      timezone: "America/New_York"
    cooldown:
      default-days: 3

  - package-ecosystem: npm
    directory: /
    assignees:
      - sbs44
    commit-message:
      prefix: chore
      include: scope
    schedule:
      interval: weekly
      day: monday
      time: "01:00"
      timezone: "America/New_York"
    cooldown:
      default-days: 7
      semver-major-days: 14
    # The packages below are owned by .github/workflows/expo-upgrade.yml.
    # When adding a new Expo/RN direct dep, update both this list and the
    # mirror step in that workflow so neither system loses coverage.
    ignore:
      - dependency-name: "expo"
      - dependency-name: "expo-*"
      - dependency-name: "@expo/*"
      - dependency-name: "react"
      - dependency-name: "react-native"
      - dependency-name: "react-native-*"
      - dependency-name: "@react-native/*"
    groups:
      dev-dependencies:
        dependency-type: development
        update-types:
          - minor
          - patch
      prod-dependencies:
        dependency-type: production
        update-types:
          - minor
          - patch
