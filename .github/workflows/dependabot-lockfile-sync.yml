name: Dependabot Lockfile Sync

# Dependabot's npm ecosystem only regenerates root/package-lock.json. Because
# example/package.json references the root via `file:..`, example's lockfile
# has a `..` block that mirrors root's devDeps and goes stale on every
# Dependabot bump. This workflow runs on Dependabot PRs, regenerates both
# lockfiles, and pushes the fix back to the PR branch so the CI drift check
# passes without manual intervention.
#
# Setup: EXPO_UPGRADE_PAT must be set as a *Dependabot* repository secret
# (Settings → Secrets and variables → Dependabot → Repository secrets).
# Dependabot-triggered pull_request runs do not see Actions secrets — only
# Dependabot secrets. The same PAT value also lives under Actions secrets for
# expo-upgrade.yml, which runs on workflow_dispatch/schedule.

on:
  pull_request:
    branches: [main]
    paths:
      - package.json
      - package-lock.json
      - example/package.json
      - example/package-lock.json

permissions:
  contents: read

concurrency:
  group: dependabot-lockfile-sync-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  sync:
    # Use the PR author rather than github.actor: the latter becomes the human
    # who clicked "Re-run" on a failed run, which would skip the job exactly
    # when we want it to retry.
    if: github.event.pull_request.user.login == 'dependabot[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout PR branch
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          # Push uses this token; must be a PAT/App so commits trigger CI on
          # subsequent pull_request events. GITHUB_TOKEN-authored commits
          # would not. See "Setup" comment at top for which secret scope.
          token: ${{ secrets.EXPO_UPGRADE_PAT }}
          ref: ${{ github.event.pull_request.head.ref }}

      - name: Setup Node
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: lts/*

      - name: Regenerate lockfiles
        run: |
          npm install --package-lock-only --ignore-scripts --no-audit --no-fund
          npm install --package-lock-only --ignore-scripts --no-audit --no-fund --prefix example

      - name: Commit and push if drift
        run: |
          if [ -z "$(git status --porcelain -- package-lock.json example/package-lock.json)" ]; then
            echo "No lockfile drift; nothing to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json example/package-lock.json
          git commit -m "chore(deps): sync lockfiles after Dependabot bump"
          git push --force-with-lease
