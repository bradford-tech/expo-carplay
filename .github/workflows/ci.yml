name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: lts/*
          cache: npm

      - run: npm ci

      - name: Verify lockfiles match package.json
        run: |
          npm install --package-lock-only --ignore-scripts
          npm install --package-lock-only --ignore-scripts --prefix example
          if ! git diff --exit-code -- package-lock.json example/package-lock.json; then
            echo "::error::Lockfile drift detected. Run 'npm install' at the repo root and in example/, then commit the updated lockfiles."
            exit 1
          fi

      - run: npx expo-module lint src/
      - run: npx tsc --noEmit
      - run: npx expo-module build
      - run: npx expo-module build plugin
