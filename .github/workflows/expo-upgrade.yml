name: Expo Upgrade

on:
  workflow_dispatch:
    inputs:
      mode:
        description: "Upgrade to expo@latest, or realign to current SDK?"
        type: choice
        required: true
        default: fix-dependencies
        options:
          - fix-dependencies
          - upgrade-expo
  schedule:
    - cron: "0 6 * * 1" # Monday 06:00 UTC (≈ 01:00 EST / 02:00 EDT)

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: expo-upgrade-${{ inputs.mode || 'fix-dependencies' }}
  cancel-in-progress: false

jobs:
  upgrade:
    runs-on: ubuntu-latest
    env:
      MODE: ${{ inputs.mode || 'fix-dependencies' }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Required when passing `token:` to peter-evans/create-pull-request
          # below — otherwise git ends up with duplicate Authorization headers
          # and rejects the push with HTTP 400.
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: lts/*
          cache: npm

      - name: Install root deps
        run: npm ci

      - name: Install example deps
        run: npm ci --prefix example

      - name: Resolve latest Expo version
        if: env.MODE == 'upgrade-expo'
        id: latest
        run: echo "version=$(npm view expo@latest version)" >> "$GITHUB_OUTPUT"

      - name: Bump example to expo@latest
        if: env.MODE == 'upgrade-expo'
        run: npm install --prefix example --no-audit --no-fund "expo@${{ steps.latest.outputs.version }}"

      - name: Realign example deps via `expo install --fix`
        working-directory: example
        run: npx expo install --fix

      - name: Mirror example versions to root devDependencies
        run: |
          EXPO_RANGE=$(node -p "require('./example/package.json').dependencies.expo")
          RN_RANGE=$(node -p "require('./example/package.json').dependencies['react-native']")
          echo "Mirroring expo=$EXPO_RANGE react-native=$RN_RANGE to root devDependencies"
          npm pkg set "devDependencies.expo=$EXPO_RANGE" "devDependencies.react-native=$RN_RANGE"
          npm install --package-lock-only --ignore-scripts --no-audit --no-fund
          npm install --package-lock-only --ignore-scripts --no-audit --no-fund --prefix example

      - name: Detect changes
        id: changes
        run: |
          if [ -z "$(git status --porcelain)" ]; then
            echo "has_changes=false" >> "$GITHUB_OUTPUT"
            echo "No changes detected — skipping PR step."
          else
            echo "has_changes=true" >> "$GITHUB_OUTPUT"
            git status --short
          fi

      - name: Capture diff stat
        if: steps.changes.outputs.has_changes == 'true'
        id: diff
        run: |
          {
            echo 'stat<<EOF'
            git diff --stat
            echo 'EOF'
          } >> "$GITHUB_OUTPUT"

      - name: Compute PR metadata
        if: steps.changes.outputs.has_changes == 'true'
        id: meta
        env:
          LATEST_VERSION: ${{ steps.latest.outputs.version }}
        run: |
          if [ "$MODE" = "upgrade-expo" ]; then
            {
              echo "branch=chore/expo-upgrade-sdk"
              echo "title=chore(deps): upgrade Expo SDK to $LATEST_VERSION"
              echo "labels=dependencies,expo,sdk-upgrade"
              echo "target_line=**Target Expo version:** \`$LATEST_VERSION\`"
            } >> "$GITHUB_OUTPUT"
          else
            {
              echo "branch=chore/expo-fix-dependencies"
              echo "title=chore(deps): realign Expo SDK dependencies"
              echo "labels=dependencies,expo"
              echo "target_line="
            } >> "$GITHUB_OUTPUT"
          fi

      - name: Open pull request
        if: steps.changes.outputs.has_changes == 'true'
        uses: peter-evans/create-pull-request@5f6978faf089d4d20b00c7766989d076bb2fc7f1 # v8.1.1
        with:
          # When EXPO_UPGRADE_PAT is set, the bot's PR will trigger downstream
          # workflows (CI on pull_request). Without it the action falls back to
          # the default GITHUB_TOKEN, which by design does not trigger workflows
          # — see the body text below.
          token: ${{ secrets.EXPO_UPGRADE_PAT || secrets.GITHUB_TOKEN }}
          branch: ${{ steps.meta.outputs.branch }}
          base: main
          commit-message: ${{ steps.meta.outputs.title }}
          title: ${{ steps.meta.outputs.title }}
          reviewers: sbs44
          assignees: sbs44
          labels: ${{ steps.meta.outputs.labels }}
          body: |
            Automated PR opened by [`expo-upgrade.yml`](./.github/workflows/expo-upgrade.yml).

            **Mode:** `${{ env.MODE }}`
            ${{ steps.meta.outputs.target_line }}

            **Diff stat:**
            ```
            ${{ steps.diff.outputs.stat }}
            ```

            [Workflow run logs](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }})

            > **CI status checks:** if no checks appear below, this PR was opened with the default `GITHUB_TOKEN`, which by design does not trigger downstream workflows. Wake CI by closing and reopening the PR, or pushing an empty commit. To eliminate this step long-term, set an `EXPO_UPGRADE_PAT` repository secret with a fine-scoped PAT or GitHub App token.
